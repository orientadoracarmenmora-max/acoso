const $ = id => document.getElementById(id);
const stage = $('stage');
const panel = $('panel');
const panelBody = $('panel-body');
const synth = window.speechSynthesis;
let current = 0;
let opener;
let voices = [];
let voiceURI = '';
let rate = 1;
let speech;
const total = slides.reduce((sum, slide) => sum + slide.minutes, 0);
const settings = [
  ['large','Texto más grande'],
  ['contrast','Alto contraste'],
  ['readable','Tipografía sencilla para títulos'],
  ['no-motion','Desactivar animaciones']
];

function element(tag, className, content) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (content) node.textContent = content;
  return node;
}

function button(label, className, onClick) {
  const node = element('button', className, label);
  node.type = 'button';
  node.onclick = onClick;
  return node;
}

function portrait(index) {
  const img = element('img','portrait');
  img.src = portraits[index];
  img.alt = '';
  return img;
}

function go(index, focus = true) {
  if (index < 0 || index >= slides.length) return;
  if (panel.open) {
    opener = null;
    panel.close();
  }
  stopReading();
  current = index;
  const slide = slides[current];
  const cover = current === 0;
  const card = element('article', cover ? 'slide cover' : slide.dialogue ? 'slide conversation' : 'slide');
  card.setAttribute('aria-labelledby', 'title');
  const copy = element('div', 'copy entry');
  copy.append(element('p','eyebrow', `${slide.tag} · ${cover ? total : slide.minutes} min`));
  const title = element('h1', null, slide.title);
  title.id = 'title';
  title.tabIndex = -1;
  copy.append(title);
  if (slide.intro) copy.append(element('p','lead',slide.intro));
  if (slide.dialogue) {
    const exchange = element('div','exchange');
    slide.dialogue.forEach(([speaker, line], index) => {
      const turn = element('section','turn entry');
      turn.style.setProperty('--delay', index ? '0.16s' : '0.04s');
      turn.append(portrait(slide.poses[index]),element('p','speaker',speaker),element('p','line',line));
      exchange.append(turn);
    });
    copy.append(exchange);
  }
  if (slide.lead) copy.append(element('p','lead',slide.lead));
  if (slide.body) copy.append(element('p','body',slide.body));
  if (cover) {
    const start = button('Comenzar →', 'primary', () => go(1));
    const faces = element('div','cover-faces entry');
    faces.append(portrait(0),portrait(1));
    copy.append(faces,start);
  } else {
    const actions = element('div', slide.quiz ? 'actions quiz' : 'actions');
    actions.setAttribute('role','group');
    actions.setAttribute('aria-label', slide.quiz ? 'Opciones de respuesta' : 'Ventanas de actividad');
    (slide.quiz || slide.buttons || []).forEach(([label, explanation], position) => {
      const control = button(label, 'reveal entry', event => {
        openPanel(label, slide.quiz ? 'quiz' : 'reveal', event.currentTarget);
        panelBody.append(element('p',null,explanation));
      });
      control.setAttribute('aria-haspopup','dialog');
      const symbol = element('span','plus',slide.quiz ? `${String.fromCharCode(65 + position)}.` : '+');
      symbol.setAttribute('aria-hidden','true');
      control.prepend(symbol);
      control.style.setProperty('--delay',`${0.1 + position * 0.055}s`);
      actions.append(control);
    });
    if (actions.childElementCount) copy.append(actions);

  }
  card.append(copy);

  stage.replaceChildren(card);
  $('counter').textContent = `${current + 1} / ${slides.length}`;
  $('progress').value = current + 1;
  $('previous').disabled = cover;
  $('next').disabled = current === slides.length - 1;
  if (focus) {
    title.focus({preventScroll:true});
    window.scrollTo(0,0);
  }
}

function openPanel(title, mode, trigger) {
  stopReading();
  opener = trigger;
  panel.classList.toggle('paper', mode === 'reveal' || mode === 'quiz');
  $('panel-title').textContent = title;
  panelBody.replaceChildren();
  $('panel-status').textContent = '';
  $('panel-audio').hidden = !['reveal','quiz','guide'].includes(mode);
  panel.showModal();
  panel.scrollTop = 0;
}

function showIndex(event) {
  openPanel('Índice de la tutoría', 'index', event.currentTarget);
  panelBody.append(element('p',null,`${total} minutos · Elige una diapositiva.`));
  const list = element('ol','index-list');
  slides.forEach((slide, index) => {
    const item = element('li');
    const link = button(slide.title, 'index-link', () => go(index));
    link.append(element('small',null,`${slide.minutes} min`));
    if (index === current) link.setAttribute('aria-current','step');
    item.append(link);
    list.append(item);
  });
  panelBody.append(list);
}

function showGuide(event) {
  openPanel('Guía docente', 'guide', event.currentTarget);
  const elapsed = slides.slice(0,current).reduce((sum, slide) => sum + slide.minutes, 0);
  panelBody.append(
    element('p',null,`${slides[current].title} · Minutos ${elapsed}–${elapsed + slides[current].minutes} de ${total}.`),
    element('p',null,slides[current].notes),
    element('p',null,'En pizarra, abre las tarjetas con + después de escuchar al grupo. Puedes usar las flechas izquierda y derecha, Inicio y Fin. Usa Tab para recorrer los controles y Escape para cerrar una ventana.'),
    element('p',null,'Fuentes para preparar la tutoría')
  );
  const sources = element('ul');
  [
    ['Ministerio de Educación · Guías de acoso y ciberacoso','https://www.educacionfpydeportes.gob.es/mc/sgctie/convivencia-escolar/recursos-nuevo/guias/acoso.html'],
    ['INCIBE · Ayuda en ciberseguridad (017)','https://www.incibe.es/linea-de-ayuda-en-ciberseguridad']
  ].forEach(([label,url]) => {
    const listItem = element('li');
    const link = element('a',null,label);
    link.href = url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    listItem.append(link);
    sources.append(listItem);
  });
  panelBody.append(sources,element('p',null,'Hugo, Elena y Álex son personajes ficticios. Los retratos de Hugo y Elena son imágenes fotográficas generadas para esta tutoría.'));
}

function updateVoices() {
  voices = synth ? synth.getVoices() : [];
  const menu = $('voice-choice');
  if (!menu) return;
  menu.replaceChildren(new Option('Español automático',''));
  const ordered = [...voices].sort((a,b) => Number(b.lang.startsWith('es')) - Number(a.lang.startsWith('es')));
  ordered.forEach(voice => menu.add(new Option(`${voice.name} (${voice.lang})`,voice.voiceURI)));
  menu.value = voices.some(voice => voice.voiceURI === voiceURI) ? voiceURI : '';
}

function showSettings(event) {
  openPanel('Accesibilidad', 'settings', event.currentTarget);
  settings.forEach(([name,label]) => {
    const wrapper = element('label','setting');
    const input = element('input');
    input.type = 'checkbox';
    input.checked = document.documentElement.classList.contains(name);
    input.onchange = () => document.documentElement.classList.toggle(name,input.checked);
    wrapper.append(input, ' ' + label);
    panelBody.append(wrapper);
  });
  const voiceLabel = element('label','setting','Voz de lectura ');
  const voiceSelect = element('select');
  voiceSelect.id = 'voice-choice';
  voiceSelect.onchange = () => { voiceURI = voiceSelect.value; };
  voiceSelect.disabled = !synth;
  voiceLabel.append(voiceSelect);
  const rateLabel = element('label','setting','Velocidad ');
  const rateSelect = element('select');
  [0.75,0.9,1,1.1,1.25].forEach(value => rateSelect.add(new Option(`${String(value).replace('.',',')}×`, value)));
  rateSelect.value = rate;
  rateSelect.disabled = !synth;
  rateSelect.onchange = () => { rate = Number(rateSelect.value); };
  rateLabel.append(rateSelect);
  panelBody.append(voiceLabel, rateLabel, element('p',null,'La lectura utiliza las voces disponibles en este navegador y dispositivo. Las preferencias del sistema de movimiento reducido se aplican automáticamente.'));
  updateVoices();
}

function stopReading() {
  speech = null;
  synth?.cancel();
  $('status').textContent = '';
  $('panel-status').textContent = '';
}

function readAloud(content) {
  stopReading();
  const status = panel.open ? $('panel-status') : $('status');
  if (!synth || !window.SpeechSynthesisUtterance) {
    status.textContent = 'Este navegador no ofrece lectura en voz alta.';
    return;
  }
  const utterance = new SpeechSynthesisUtterance(content);
  const voice = voices.find(item => item.voiceURI === voiceURI) ||
    voices.find(item => /^es-ES$/i.test(item.lang)) || voices.find(item => /^es/i.test(item.lang));
  utterance.lang = voice?.lang || 'es-ES';
  if (voice) utterance.voice = voice;
  utterance.rate = rate;
  utterance.onend = () => {
    if (speech !== utterance) return;
    speech = null;
    status.textContent = 'Lectura terminada.';
  };
  utterance.onerror = () => {
    if (speech !== utterance) return;
    speech = null;
    status.textContent = 'No se pudo iniciar o completar la lectura. Prueba otra voz.';
  };
  speech = utterance;
  synth.speak(utterance);
}

$('previous').onclick = () => go(current - 1);
$('next').onclick = () => go(current + 1);
$('index').onclick = showIndex;
$('guide').onclick = showGuide;
$('settings').onclick = showSettings;
for (const id of ['index','guide','settings']) $(id).setAttribute('aria-haspopup','dialog');
$('close-panel').onclick = () => panel.close();
panel.addEventListener('close', () => {
  stopReading();
  if (opener?.isConnected) opener.focus({preventScroll:true});
});
$('listen').onclick = () => {
  const slide = slides[current];
  const choices = (slide.quiz || slide.buttons || []).map(([label]) => label);
  const dialogue = (slide.dialogue || []).map(([speaker, line]) => speaker + '. ' + line);
  readAloud([slide.title, slide.intro, ...dialogue, slide.lead, slide.body, ...choices].filter(Boolean).join(' '));
};
$('listen-panel').onclick = () => readAloud(`${$('panel-title').textContent}. ${panelBody.innerText}`);
for (const id of ['stop','stop-panel']) $(id).onclick = stopReading;
synth?.addEventListener('voiceschanged',updateVoices);
updateVoices();
const viewport = document.documentElement;
$('full').hidden = !document.fullscreenEnabled;
$('full').onclick = async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await viewport.requestFullscreen();
  } catch {
    $('status').textContent = 'El navegador no pudo activar la pantalla completa.';
  }
};
document.addEventListener('fullscreenchange',() => {
  const full = Boolean(document.fullscreenElement);
  $('full').textContent = full ? 'Salir de pantalla completa' : 'Pantalla completa';
  $('full').setAttribute('aria-pressed',String(full));
});
document.addEventListener('keydown',event => {
  if (panel.open || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey ||
      event.target.matches('input,select,textarea,[contenteditable]')) return;
  const destinations = {ArrowRight:current+1, ArrowLeft:current-1, Home:0, End:slides.length-1};
  if (!Object.hasOwn(destinations,event.key)) return;
  event.preventDefault();
  go(destinations[event.key]);
});
go(0,false);
</script>
</body>
</html>
